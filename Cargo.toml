[package]
name = "giter"
version = "0.1.0"
edition = "2024"
description = "A keyboard-first Git TUI with explicit conflict inspection"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
ignore = "0.4"
notify = "8.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
tiny-skia = "0.11"
unicode-segmentation = "1.13"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.27"
